# Publishes p01-p03 review-pack images. See pf-cloud-k8s/docs/ghcr.md.
name: push-ghcr

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pf-identity-idp
            context: apps/server
            file: apps/server/Dockerfile
          - image: pf-identity-admin
            context: apps/admin
            file: apps/admin/Dockerfile
          - image: pf-identity-sample-rp
            context: apps/sample-rp
            file: apps/sample-rp/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
