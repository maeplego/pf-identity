{{define "layout"}}
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — learning IdP</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap");
:root{
  color-scheme:light dark;
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#f4f6fb;
  --bg-accent:radial-gradient(1200px 600px at 10% -10%,rgba(99,102,241,.12),transparent 55%),radial-gradient(900px 500px at 90% 0%,rgba(14,165,233,.1),transparent 50%),var(--bg);
  --surface-solid:#fff;
  --border:rgba(15,23,42,.08);
  --text:#0f172a;
  --muted:#64748b;
  --accent:#4f46e5;
  --accent-hover:#4338ca;
  --accent-soft:rgba(79,70,229,.12);
  --danger:#dc2626;
  --radius:14px;
  --radius-sm:10px;
  --shadow-sm:0 4px 16px rgba(15,23,42,.06);
  --max:32rem;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1020;
    --bg-accent:radial-gradient(1200px 600px at 10% -10%,rgba(99,102,241,.18),transparent 55%),radial-gradient(900px 500px at 90% 0%,rgba(14,165,233,.12),transparent 50%),var(--bg);
    --surface-solid:#111827;
    --border:rgba(148,163,184,.14);
    --text:#e2e8f0;
    --muted:#94a3b8;
    --accent:#818cf8;
    --accent-hover:#a5b4fc;
    --accent-soft:rgba(129,140,248,.16);
    --shadow-sm:0 6px 20px rgba(0,0,0,.25);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font);
  line-height:1.55;
  background:var(--bg-accent);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  padding:2rem 1rem 3rem;
}
.note{
  max-width:var(--max);
  margin:0 auto 1.25rem;
  padding:.65rem .85rem;
  border-radius:var(--radius-sm);
  background:var(--accent-soft);
  color:var(--muted);
  font-size:.88rem;
  border:1px solid var(--border);
}
h1{
  max-width:var(--max);
  margin:0 auto 1rem;
  font-size:clamp(1.4rem,2.5vw,1.75rem);
  letter-spacing:-.03em;
}
form{
  background:var(--surface-solid);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  padding:1.25rem 1.35rem;
  max-width:var(--max);
  margin:0 auto;
}
label{
  display:block;
  margin-bottom:.9rem;
  font-size:.88rem;
  color:var(--muted);
}
input{
  display:block;
  width:100%;
  margin-top:.35rem;
  padding:.6rem .75rem;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--surface-solid);
  color:var(--text);
  font:inherit;
}
button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:.55rem 1.15rem;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,var(--accent),#6366f1);
  color:#fff;
  font:inherit;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(79,70,229,.28);
  transition:transform .15s ease,box-shadow .15s ease;
}
button:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(79,70,229,.34)}
a{color:var(--accent);text-decoration:none;transition:color .15s ease}
a:hover{color:var(--accent-hover)}
.error{color:var(--danger);max-width:var(--max);margin:0 auto .75rem}
body>p{max-width:var(--max);margin:.85rem auto 0}
</style>
</head>
<body>
<p class="note">学習用 Identity Provider です。本番の認証には使わないでください。</p>
{{template "content" .}}
</body>
</html>
{{end}}
